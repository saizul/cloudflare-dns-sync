[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudflare-dns-sync"
dynamic = ["version"]
description = "DNS records as code for Cloudflare: YAML zone files, a colored plan diff against the live zone, safe apply that never touches unmanaged records, export of existing zones and a GitHub Actions workflow."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saizul Amin" }]
keywords = ["cloudflare", "dns", "dns-records", "infrastructure-as-code", "gitops", "yaml", "cli", "github-actions", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/saizul/cloudflare-dns-sync"
Issues = "https://github.com/saizul/cloudflare-dns-sync/issues"
Changelog = "https://github.com/saizul/cloudflare-dns-sync/blob/main/CHANGELOG.md"

[project.scripts]
cloudflare-dns-sync = "cloudflare_dns_sync.cli:main"
cfdns-sync = "cloudflare_dns_sync.cli:main"

[tool.setuptools.dynamic]
version = { attr = "cloudflare_dns_sync._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloudflare_dns_sync = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "RUF022", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
