name: Feature request
description: Suggest an improvement to zone files, plan output or commands
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Zone file keys or CLI flags you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
